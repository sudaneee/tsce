<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>
<main id="main">
<section class="page-hero"><div class="container">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="../index.html">Home</a><i class="fa-solid fa-chevron-right"></i><span>Verify certificate</span></nav>
    <span class="eyebrow">Certificate verification</span><h1>Verify a TSCE certificate</h1><p class="lead">Employers and institutions can confirm the authenticity of any TSCE certificate of completion instantly.</p>
</div></section>
<section class="section" style="padding-top:48px"><div class="container verify-box">
    <div class="card card-pad">
        <form id="verifyForm" novalidate><div class="field"><label for="verifyNo">Certificate number</label><div class="flex"><div class="input-icon" style="flex:1"><i class="fa-solid fa-certificate"></i><input id="verifyNo" class="input" placeholder="e.g. TSCE/CERT/2026/00108" autocomplete="off"></div><button class="btn btn-primary">Verify</button></div></div></form>
        <p class="hint mt-2">Try demo numbers: <button class="link-btn small" data-sample="TSCE/CERT/2026/00108">TSCE/CERT/2026/00108</button> · <button class="link-btn small" data-sample="TSCE/CERT/2026/00124">TSCE/CERT/2026/00124</button> · <button class="link-btn small" data-sample="TSCE/CERT/2026/99999">TSCE/CERT/2026/99999</button></p>
    </div>
    <div class="verify-result" id="verifyResult" aria-live="polite"></div>
</div></section>
