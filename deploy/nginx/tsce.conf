# TSCE portal — nginx site. bootstrap.sh replaces __DOMAIN__ and installs it as
# /etc/nginx/sites-available/tsce; certbot then adds HTTPS + the http→https redirect.
#
#   frontend/          → served directly from the repo (/srv/tsce/frontend)
#   /api/  /admin/     → Django (gunicorn on a unix socket)
#   /static/           → Django admin assets (collectstatic)
#   private uploads    → NEVER served here (/var/lib/tsce/private_media); Django streams them to staff only

upstream tsce_app {
    server unix:/run/tsce/gunicorn.sock fail_timeout=0;
}

# The domain is proxied by Cloudflare. Restore the visitor's real IP for THIS site
# only, trusting Cloudflare's published ranges (https://www.cloudflare.com/ips/),
# so rate limits see real visitors and nobody can spoof an IP by skipping Cloudflare.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    set_real_ip_from 173.245.48.0/20;  set_real_ip_from 103.21.244.0/22;  set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;    set_real_ip_from 141.101.64.0/18;  set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;  set_real_ip_from 188.114.96.0/20;  set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;  set_real_ip_from 162.158.0.0/15;   set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;    set_real_ip_from 172.64.0.0/13;    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;   set_real_ip_from 2606:4700::/32;   set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;   set_real_ip_from 2405:8100::/32;   set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    root /srv/tsce/frontend;
    index index.html;
    client_max_body_size 7m;          # WAEC result uploads are capped at 5 MB by the app
    server_tokens off;

    # --- Django ---
    location /api/ {
        proxy_pass http://tsce_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # the real client (see real_ip above); NUM_PROXIES=1
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 90s;       # Zainpay calls can take up to 30 s
    }
    location /admin/ {
        proxy_pass http://tsce_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # the real client (see real_ip above); NUM_PROXIES=1
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
    location /static/ {
        alias /var/www/tsce/static/;
        expires 7d;
        access_log off;
    }

    # --- Frontend (plain files) ---
    # JS/CSS/HTML aren't fingerprinted, so browsers revalidate them (cheap 304s) and
    # always pick up a new release; images and fonts can be cached longer.
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri $uri/ =404;
    }

    # Never serve dotfiles (.git, .env, …) even if something ends up under the web root.
    location ~ /\. { deny all; return 404; }

    error_page 404 /index.html;
}
